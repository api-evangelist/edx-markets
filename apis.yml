aid: edx-markets
name: EDX Markets
description: >-
  EDX Markets is an institutional cryptocurrency exchange that operates the
  world's only centrally cleared crypto trading venue, combining deep liquidity,
  transparent markets, low trading costs and ultra-low-latency matching-engine
  technology. It runs a spot exchange (EDX Markets), a perpetual-futures
  exchange (EDXM International, based in Singapore), a central clearinghouse with
  daily net settlement and bankruptcy-remote member accounts (EDXM Global), and
  a white-label crypto-as-a-service platform (EDX FlowConnect). Connectivity for
  members is delivered over the FIX protocol — FIX 5.0 SP2 order entry and drop
  copy plus FIX and binary (SBE) market data, transported over mutually
  authenticated TLS — rather than a public REST/OpenAPI. EDX is backed by
  institutional partners and was surfaced through the pantera-capital portfolio.
