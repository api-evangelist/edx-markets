description: >-
  EDX Markets separates a UAT (User Acceptance Testing) environment from
  Production. UAT is a full parallel venue with its own FIX Order Entry, Market
  Data, Binary (SBE) Market Data and Drop Copy specifications, FIX dictionaries,
  and its own onboarding/contact form. There are no synthetic test cards (this
  is a FIX order-entry venue, not a card acquirer); test order flow is exercised
  against the UAT matching engine using UAT-provisioned FIX credentials.
  Onboarding to either environment is member-provisioned by EDX Market
  Operations, so no self-serve test keys are published.
